AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ExpertiseRAG - GraphRAG platform using Memgraph (EC2/EBS) for the knowledge
  graph and PostgreSQL pgvector (RDS) for chunk vector storage.

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  SiweAuthorizerFunctionArn:
    Type: String
    Default: ""
    Description: >
      Lambda authorizer guarding the /health routes. The same SIWE authorizer
      TeamWeave uses, so the platform has one notion of who a caller is. Empty
      disables the health surface entirely -- see HealthEnabled. It is never
      "authorizer optional": every expertise route on this API is open, which
      is why the health routes cannot be.
  HealthDocsBucketName:
    Type: String
    Default: ""
    Description: >
      Bucket holding health documents. Separate from the artifacts bucket on
      purpose; leave empty and one is created for this stack.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  GenerationModelId:
    Type: String
    Default: us.amazon.nova-pro-v1:0
    Description: >
      Bedrock inference profile ID used by the Query API for answer synthesis.
      Must use cross-region inference profile (us. prefix) for on-demand throughput.

  LogRetentionDays:
    Type: Number
    Default: 3
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
    Description: CloudWatch log retention period in days

  EnableStepFunctions:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Deploy Step Functions ingestion orchestration state machine

  # ── Networking (resolved from tarun-teamweave-shared at deploy time) ────────
  SharedVpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      VPC ID from the shared infrastructure stack (tarun-teamweave-shared).
      Resolved and passed as a parameter-override during deployment.

  SharedLambdaSubnetAz1Id:
    Type: AWS::EC2::Subnet::Id
    Description: >
      AZ-1 Lambda private subnet from the shared infrastructure stack.

  SharedLambdaSubnetAz2Id:
    Type: AWS::EC2::Subnet::Id
    Description: >
      AZ-2 Lambda private subnet from the shared infrastructure stack.

  SharedPublicSubnetAz1Id:
    Type: AWS::EC2::Subnet::Id
    Description: >
      AZ-1 public subnet from the shared infrastructure stack (used by Memgraph EC2).

  SharedObservatoryMetricsTableName:
    Type: String
    Description: Observatory metrics DynamoDB table name from the shared infrastructure stack

  SharedObservatoryMetricsTableArn:
    Type: String
    Description: Observatory metrics DynamoDB table ARN from the shared infrastructure stack

  AdminCidr:
    Type: String
    Default: 10.0.0.0/8
    Description: CIDR allowed SSH access to the Memgraph EC2 instance

  EC2KeyPairName:
    Type: String
    Default: ''
    Description: EC2 key pair name for SSH access to Memgraph instance (optional)

  # ── Memgraph EC2 ──────────────────────────────────────────────────────────
  MemgraphInstanceType:
    Type: String
    Default: t4g.nano
    AllowedValues: [t4g.nano, t4g.small, t4g.medium, t4g.large, t3.medium, t3.large, t3.xlarge, m6i.large, m6i.xlarge, m7g.medium, m7g.large]
    Description: EC2 instance type for Memgraph (t4g = Graviton2 arm64, recommended for cost)

  MemgraphArmAMI:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: >
      AL2023 arm64 AMI for Graviton Memgraph instances (t4g / m7g / c7g families).
      Resolved from SSM on first deploy and pinned in the stack thereafter.
      To update intentionally pass --parameter-overrides MemgraphArmAMI=ami-xxxxxxxx.

  MemgraphX86AMI:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >
      AL2023 x86_64 AMI for non-Graviton Memgraph instances (t3 / m6i families).
      Resolved from SSM on first deploy and pinned in the stack thereafter.
      To update intentionally pass --parameter-overrides MemgraphX86AMI=ami-xxxxxxxx.

  MemgraphEBSSizeGB:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
    Description: EBS volume size (GB) for Memgraph data persistence

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  PostgresInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium, db.t3.micro, db.t3.medium, db.t3.large, db.r6g.large, db.r8g.large]
    Description: RDS instance class for PostgreSQL (db.t4g = Graviton2 arm64, recommended for cost)

  PostgresDbName:
    Type: String
    Default: expertiserag
    Description: PostgreSQL database name

  PostgresUsername:
    Type: String
    Default: expertiserag
    Description: PostgreSQL master username

# ─────────────────────────────────────────────────────────────────────────────
# Conditions
# ─────────────────────────────────────────────────────────────────────────────
Conditions:
  DeployStepFunctions: !Equals [!Ref EnableStepFunctions, 'true']
  HasEC2KeyPair: !Not [!Equals [!Ref EC2KeyPairName, '']]
  # True when a Graviton (arm64) instance family is selected for Memgraph
  MemgraphIsGraviton: !Or
    - !Equals [!Select [0, !Split ['.', !Ref MemgraphInstanceType]], 't4g']
    - !Equals [!Select [0, !Split ['.', !Ref MemgraphInstanceType]], 'm7g']
    - !Equals [!Select [0, !Split ['.', !Ref MemgraphInstanceType]], 'c7g']

  # The health surface exists only with an authorizer to put in front of it.
  # Every expertise route on this API is open, which is exactly why the health
  # routes cannot be -- and a health endpoint deployed without an authorizer by
  # accident is the failure this gate prevents. No authorizer, no surface.
  HealthEnabled: !Not [!Equals [!Ref SiweAuthorizerFunctionArn, '']]
  CreateHealthBucket: !And
    - !Condition HealthEnabled
    - !Equals [!Ref HealthDocsBucketName, '']

# ─────────────────────────────────────────────────────────────────────────────
# Globals
# ─────────────────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 300
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: expertise-rag
        LOG_LEVEL: DEBUG
        ENVIRONMENT: !Ref Environment
        ARTIFACTS_BUCKET: !Sub contextweave-rag-artifacts-${AWS::AccountId}-${Environment}
        MEMGRAPH_SECRET_ARN: !Ref MemgraphSecret
        POSTGRES_SECRET_ARN: !Ref PostgresSecret
        OBSERVATORY_METRICS_TABLE: !Ref SharedObservatoryMetricsTableName
    Tags:
      Project: ExpertiseRAG
      Environment: !Ref Environment

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ───────────────────────────────────────────
  # KMS Key for encryption at rest
  # ───────────────────────────────────────────
  ArtifactsKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub ExpertiseRAG S3 and Lambda encryption key (${Environment})
      EnableKeyRotation: true
      MultiRegion: false
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccount
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
      Tags:
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment

  ArtifactsKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/contextweave-rag-${Environment}
      TargetKeyId: !Ref ArtifactsKMSKey

  # ───────────────────────────────────────────
  # VPC Interface Endpoints – created in the shared VPC so Lambda can reach
  # Secrets Manager and Neptune without a NAT Gateway.  Bedrock Runtime is
  # omitted here because the shared stack (tarun-teamweave-shared) already
  # provides that endpoint; we import its ID instead of creating a duplicate.
  # ───────────────────────────────────────────
  # ───────────────────────────────────────────
  # Security Groups
  # ───────────────────────────────────────────

  # Lambda functions SG – outbound only (in shared VPC).
  # IPv4 egress covers VPC-local traffic (RDS, Memgraph, Bedrock VPCE).
  # IPv6 egress routes AWS API calls (Secrets Manager, S3, etc.) through the
  # shared VPC Egress-Only Internet Gateway using dual-stack endpoints.
  LambdaSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ExpertiseRAG Lambda functions - egress only
      VpcId: !Ref SharedVpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: "IPv4 egress (VPC-local: RDS, Memgraph, Bedrock VPCE)"
        - IpProtocol: '-1'
          CidrIpv6: ::/0
          Description: "IPv6 egress via EIGW (Secrets Manager, S3 dual-stack)"
      Tags:
        - Key: Name
          Value: !Sub contextweave-rag-lambda-sg-${Environment}

  # Memgraph EC2 SG – bolt (7687) from Lambda, SSH from admin CIDR (in shared VPC)
  MemgraphSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ExpertiseRAG Memgraph EC2 instance
      VpcId: !Ref SharedVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 7687
          ToPort: 7687
          SourceSecurityGroupId: !Ref LambdaSG
          Description: Bolt protocol from Lambda
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
          Description: SSH from admin CIDR
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub contextweave-rag-memgraph-sg-${Environment}

  # RDS PostgreSQL SG – port 5432 from Lambda (in shared VPC)
  PostgresSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ExpertiseRAG RDS PostgreSQL
      VpcId: !Ref SharedVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSG
          Description: PostgreSQL from Lambda
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref MemgraphSG
          Description: PostgreSQL from Memgraph EC2 (for admin access)
      Tags:
        - Key: Name
          Value: !Sub contextweave-rag-postgres-sg-${Environment}

  # ───────────────────────────────────────────
  # Secrets Manager – Memgraph connection info
  # ───────────────────────────────────────────
  MemgraphSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub contextweave-rag-memgraph-${Environment}
      Description: Memgraph EC2 connection info for ExpertiseRAG
      # EC2 private IP is injected at deploy time via !Sub ${MemgraphEC2.PrivateIp}
      # Username/password are empty (Memgraph CE has no auth by default)
      SecretString: !Sub |
        {
          "host": "${MemgraphEC2.PrivateIp}",
          "port": 7687,
          "username": "",
          "password": ""
        }
      Tags:
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment

  # ───────────────────────────────────────────
  # Secrets Manager – PostgreSQL credentials
  # ───────────────────────────────────────────
  PostgresSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub contextweave-rag-postgres-${Environment}
      Description: PostgreSQL credentials for ExpertiseRAG pgvector
      GenerateSecretString:
        SecretStringTemplate: !Sub |
          {
            "username": "${PostgresUsername}",
            "dbname": "${PostgresDbName}",
            "port": 5432
          }
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment

  # ───────────────────────────────────────────
  # Memgraph EC2 instance + EBS volume
  # ───────────────────────────────────────────
  MemgraphInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub contextweave-rag-memgraph-ec2-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: S3BinariesRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::contextweave-rag-artifacts-${AWS::AccountId}-${Environment}/binaries/*
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt ArtifactsKMSKey.Arn
      Tags:
        - Key: Project
          Value: ExpertiseRAG

  MemgraphInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref MemgraphInstanceRole

  MemgraphLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub contextweave-rag-memgraph-${Environment}
      LaunchTemplateData:
        # Persistent Spot request: instance restarts automatically when capacity
        # is restored; EBS data survives interruption.  ~50-70% saving vs on-demand.
        # InstanceMarketOptions is only valid in LaunchTemplate, not AWS::EC2::Instance.
        InstanceMarketOptions:
          MarketType: spot
          SpotOptions:
            SpotInstanceType: persistent
            InstanceInterruptionBehavior: stop
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: memgraph
                Value: "true"
              - Key: Name
                Value: !Sub contextweave-rag-memgraph-${Environment}
              - Key: Project
                Value: ExpertiseRAG
              - Key: Environment
                Value: !Ref Environment
          - ResourceType: spot-instances-request
            Tags:
              - Key: memgraph
                Value: "true"
              - Key: Name
                Value: !Sub contextweave-rag-memgraph-${Environment}
              - Key: Project
                Value: ExpertiseRAG
              - Key: Environment
                Value: !Ref Environment
          - ResourceType: volume
            Tags:
              - Key: memgraph
                Value: "true"
              - Key: Name
                Value: !Sub contextweave-rag-memgraph-${Environment}
              - Key: Project
                Value: ExpertiseRAG
              - Key: Environment
                Value: !Ref Environment

  MemgraphEC2:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref MemgraphLaunchTemplate
        Version: !GetAtt MemgraphLaunchTemplate.LatestVersionNumber
      InstanceType: !Ref MemgraphInstanceType
      ImageId: !If [MemgraphIsGraviton, !Ref MemgraphArmAMI, !Ref MemgraphX86AMI]
      SubnetId: !Ref SharedPublicSubnetAz1Id
      SecurityGroupIds:
        - !Ref MemgraphSG
      IamInstanceProfile: !Ref MemgraphInstanceProfile
      KeyName: !If [HasEC2KeyPair, !Ref EC2KeyPairName, !Ref AWS::NoValue]
      PropagateTagsToVolumeOnCreation: true
      # Data volume defined inline so it is always attached before UserData runs,
      # eliminating the race condition that occurs when a separate
      # AWS::EC2::VolumeAttachment is used during instance replacement.
      # DeleteOnTermination: false preserves the volume across stop/start;
      # on a true instance replacement a fresh volume is created (acceptable
      # because Memgraph data can be re-ingested from S3).
      BlockDeviceMappings:
        - DeviceName: /dev/xvdf
          Ebs:
            VolumeSize: !Ref MemgraphEBSSizeGB
            VolumeType: gp3
            Encrypted: true
            KmsKeyId: !Ref ArtifactsKMSKey
            DeleteOnTermination: false
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/userdata.log 2>&1
          log() { echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] $*"; }

          log "=== UserData start ==="

          # --- EBS: resolve device (xvdf on Xen, nvme1n1 on Nitro) ---
          log "Waiting for EBS volume..."
          EBS_DEV=""
          for i in $(seq 1 30); do
            for dev in /dev/xvdf /dev/nvme1n1; do
              [ -b "$dev" ] && EBS_DEV="$dev" && break 2
            done
            sleep 2
          done
          [ -n "$EBS_DEV" ] || { log "ERROR: EBS device not found after 60s"; exit 1; }
          log "EBS device: $EBS_DEV"

          # Format only if filesystem is absent
          if ! blkid "$EBS_DEV" &>/dev/null; then
            log "Formatting $EBS_DEV as xfs..."
            mkfs.xfs "$EBS_DEV"
          fi

          mkdir -p /var/lib/memgraph
          mount "$EBS_DEV" /var/lib/memgraph
          grep -qF "$EBS_DEV" /etc/fstab \
            || echo "$EBS_DEV /var/lib/memgraph xfs defaults,nofail 0 2" >> /etc/fstab
          log "EBS mounted at /var/lib/memgraph"

          # Data dir ownership (memgraph container runs as UID 101)
          mkdir -p /var/lib/memgraph/data
          chown -R 101:101 /var/lib/memgraph
          log "Directories ready"

          # --- Docker ---
          log "Installing Docker..."
          dnf install -y docker
          systemctl enable --now docker
          log "Docker started"

          # --- Pull image with exponential-backoff retries ---
          log "Pulling memgraph/memgraph:3.8.1 (linux/arm64)..."
          pulled=false
          for attempt in 1 2 3 4 5; do
            if docker pull --platform linux/arm64 memgraph/memgraph:3.8.1; then
              pulled=true
              break
            fi
            wait_sec=$((attempt * 15))
            log "Pull attempt $attempt failed; retrying in ${!wait_sec}s..."
            sleep ${!wait_sec}
          done
          ${!pulled} || { log "ERROR: docker pull failed after 5 attempts"; exit 1; }
          log "Image pulled"

          # --- Start Memgraph ---
          log "Starting Memgraph container..."
          docker run -d \
            --name memgraph \
            --restart=unless-stopped \
            --platform linux/arm64 \
            -p 7687:7687 \
            -v /var/lib/memgraph:/var/lib/memgraph \
            memgraph/memgraph:3.8.1 \
            --bolt-address=0.0.0.0 \
            --bolt-port=7687 \
            --storage-properties-on-edges=true \
            --storage-snapshot-interval-sec=300 \
            --storage-wal-enabled=true \
            --data-recovery-on-startup=true \
            --also-log-to-stderr=true \
            --log-file=/var/log/memgraph/memgraph \
            --log-level=WARNING

          # --- Verify container is running ---
          sleep 5
          if docker ps --filter "name=^memgraph$" --filter "status=running" | grep -q memgraph; then
            log "Memgraph container running"
          else
            log "ERROR: Memgraph container not running after start"
            docker logs memgraph || true
            exit 1
          fi

          log "=== UserData complete ==="
      Tags:
        - Key: memgraph
          Value: "true"
        - Key: Name
          Value: !Sub contextweave-rag-memgraph-${Environment}
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment

  # ───────────────────────────────────────────
  # RDS PostgreSQL with pgvector
  # ───────────────────────────────────────────
  PostgresSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBSubnetGroupDescription: ExpertiseRAG PostgreSQL subnet group
      DBSubnetGroupName: !Sub "contextweave-rag-postgres-sg-${Environment}"
      SubnetIds:
        - !Ref SharedLambdaSubnetAz1Id
        - !Ref SharedLambdaSubnetAz2Id
      Tags:
        - Key: Project
          Value: ExpertiseRAG

  PostgresRDS:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            # Deprecated-engine-version warning. Suppressed deliberately: the
            # remedy cfn-lint implies (bump the version) is a live RDS
            # modification, and doing it to keep a linter quiet already took
            # prod down once. Upgrading is tracked as maintenance work, not as
            # a build-break to clear.
            - W3691
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBInstanceClass: !Ref PostgresInstanceClass
      Engine: postgres
      # Pinned to what the instance is ACTUALLY running. Do not bump this to
      # satisfy a linter, and do not lower it to match an older comment.
      #
      # History, because this has now failed in two different ways:
      #
      # 1. It was bumped to 16.15 and then 16.14 to silence cfn-lint's W3691
      #    (`sam validate --lint` treats any matched rule as a build failure).
      #    That deploy wedged contextweave-rag-prod in UPDATE_ROLLBACK_FAILED:
      #    the instance was STOPPED, RDS refuses to modify a stopped instance
      #    ("You can't modify a stopped DB instance"), and the rollback then
      #    failed for the same reason, so the stack could not move in either
      #    direction. W3691 is suppressed in the Metadata block above rather
      #    than silenced by mutating production, and the deploy workflow now
      #    starts the instance before touching the stack.
      #
      # 2. This was then set back to 16.6 on the belief that 16.6 was what the
      #    instance ran. By then it did not: the live instance is on 16.14, and
      #    the next deploy failed with "Cannot find upgrade path from 16.14 to
      #    16.6". Minor versions cannot be downgraded, so a stale pin here is
      #    not a no-op -- it is an impossible request, and CloudFormation
      #    spends three minutes discovering that before rolling back.
      #
      # Why it drifts: AutoMinorVersionUpgrade is not set, and its default is
      # true, so RDS moves the minor version during a maintenance window and
      # this pin goes stale on its own, with no commit doing anything wrong.
      # The permanent fixes are to set AutoMinorVersionUpgrade: false (which
      # also stops security patches) or to pin the major version only as '16'
      # (which hands the minor to RDS). Both are policy decisions about
      # patching, not build fixes, so neither is taken here unilaterally.
      #
      # Until one is taken, confirm the live version before deploying anything
      # that touches this resource -- the deploy workflow's "Ensure the
      # Postgres instance is running" step now does exactly this and fails
      # fast on a mismatch:
      #   aws rds describe-db-instances \
      #     --query "DBInstances[].[DBInstanceIdentifier,DBInstanceStatus,EngineVersion]"
      EngineVersion: '16.14'
      DBName: !Ref PostgresDbName
      MasterUsername: !Ref PostgresUsername
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${PostgresSecret}:SecretString:password}}'
      AllocatedStorage: '50'
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !Ref ArtifactsKMSKey
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref PostgresSubnetGroup
      VPCSecurityGroups:
        - !Ref PostgresSG
      BackupRetentionPeriod: 7
      EnablePerformanceInsights: false
      EnableCloudwatchLogsExports:
        - postgresql
      Tags:
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment

  # ───────────────────────────────────────────
  # S3 Bucket – raw uploads and derived artifacts
  # ───────────────────────────────────────────
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub contextweave-rag-artifacts-${AWS::AccountId}-${Environment}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ArtifactsKMSKey
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionNoncurrentToIA
            Status: Enabled
            NoncurrentVersionTransitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
            NoncurrentVersionExpirationInDays: 365
          - Id: CleanupIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/
            Function: !GetAtt PreprocessorFunction.Arn
      Tags:
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonSSLRequests
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub ${ArtifactsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Trigger permission: S3 → PreprocessorFunction
  PreprocessorS3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PreprocessorFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::contextweave-rag-artifacts-${AWS::AccountId}-${Environment}
      SourceAccount: !Ref AWS::AccountId

  # ───────────────────────────────────────────
  # CloudWatch Log Groups
  # ───────────────────────────────────────────
  PreprocessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/contextweave-rag-preprocessor-${Environment}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment

  QueryAPILogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/contextweave-rag-query-api-${Environment}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment

  DBInitLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/contextweave-rag-db-init-${Environment}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment

  StepFunctionsLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DeployStepFunctions
    Properties:
      LogGroupName: !Sub /aws/states/contextweave-rag-ingestion-${Environment}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment


  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/contextweave-rag-${Environment}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment

  # ───────────────────────────────────────────
  # IAM Roles
  # ───────────────────────────────────────────

  # Shared inline policy for Lambda VPC networking
  LambdaVPCPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub contextweave-rag-lambda-vpc-${Environment}
      Description: Allows Lambda to create/delete VPC ENIs
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: '*'

  # Shared inline policy for Secrets Manager reads
  SecretsReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub contextweave-rag-secrets-read-${Environment}
      Description: Allows ExpertiseRAG Lambdas to read DB secrets
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !Ref MemgraphSecret
              - !Ref PostgresSecret

  # Role: Preprocessor Lambda
  PreprocessorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub contextweave-rag-preprocessor-${Environment}
      Description: Allows preprocessor Lambda to read/write S3, embed via Bedrock, write to Memgraph and pgvector
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - !Ref LambdaVPCPolicy
        - !Ref SecretsReadPolicy
      Policies:
        - PolicyName: S3ReadWriteDerived
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRaw
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:HeadObject
                Resource: !Sub arn:aws:s3:::contextweave-rag-artifacts-${AWS::AccountId}-${Environment}/raw/*
              - Sid: WriteDerived
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectTagging
                Resource: !Sub arn:aws:s3:::contextweave-rag-artifacts-${AWS::AccountId}-${Environment}/derived/*
              - Sid: ListBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::contextweave-rag-artifacts-${AWS::AccountId}-${Environment}
                Condition:
                  StringLike:
                    s3:prefix:
                      - raw/*
                      - derived/*
        - PolicyName: BedrockEmbeddings
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
        - PolicyName: KMSDecryptEncrypt
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt ArtifactsKMSKey.Arn
        - PolicyName: ObservatoryMetricsWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !Ref SharedObservatoryMetricsTableArn
      Tags:
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment

  # Role: Query API Lambda
  QueryAPIRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub contextweave-rag-query-api-${Environment}
      Description: Allows Query API Lambda to embed via Bedrock, query Memgraph, and query pgvector
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - !Ref LambdaVPCPolicy
        - !Ref SecretsReadPolicy
      Policies:
        - PolicyName: BedrockInvokeModel
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BedrockInvokeModel
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  # Cross-region inference profile – wildcard region required because
                  # us.amazon.nova-pro-v1:0 may route to us-east-1, us-east-2, or us-west-2
                  - arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-pro-v1:0
                  # Nova Micro used for question classification (regional, no inference profile)
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
        - PolicyName: S3ReadDerived
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub ${ArtifactsBucket.Arn}/derived/*
        - PolicyName: KMSDecrypt
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !GetAtt ArtifactsKMSKey.Arn
        - PolicyName: ObservatoryMetricsWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !Ref SharedObservatoryMetricsTableArn
      Tags:
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment

  # Role: DB Init Lambda
  DBInitRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub contextweave-rag-db-init-${Environment}
      Description: Allows DB init Lambda to create pgvector schema and seed Memgraph routing graph
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - !Ref LambdaVPCPolicy
        - !Ref SecretsReadPolicy
      Policies:
        - PolicyName: S3FullAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:*
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub ${ArtifactsBucket.Arn}/*
              - Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                Resource: !GetAtt ArtifactsKMSKey.Arn
        # Read of the health credential belongs to this role alone, as its own
        # policy. Adding the health secret to SecretsReadPolicy would have been
        # one line and would have handed it to the preprocessor and the query
        # API too -- the two functions the separate database exists to keep
        # away from it. A shared policy is the cheapest place to undo an
        # isolation without any diff looking wrong.
        - !If
          - HealthEnabled
          - PolicyName: HealthSecretRead
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                    - secretsmanager:DescribeSecret
                  Resource: !Ref HealthPostgresSecret
          - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment

  # Role: Step Functions
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Condition: DeployStepFunctions
    Properties:
      RoleName: !Sub contextweave-rag-sfn-${Environment}
      Description: Allows Step Functions ingestion state machine to invoke Lambdas
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub states.${AWS::Region}.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt PreprocessorFunction.Arn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:PutLogEvents
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'
        - PolicyName: XRayTracing
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'
      Tags:
        - Key: Project
          Value: ExpertiseRAG
        - Key: Environment
          Value: !Ref Environment

  # ───────────────────────────────────────────
  # Lambda: Preprocessor
  # ───────────────────────────────────────────
  PreprocessorFunction:
    Type: AWS::Serverless::Function
    DependsOn: PreprocessorLogGroup
    Properties:
      FunctionName: !Sub contextweave-rag-preprocessor-${Environment}
      Description: >
        Reads raw repo uploads from S3, extracts text, chunks and embeds content,
        writes to pgvector and Memgraph, then emits derived JSON artifacts to S3.
      CodeUri: src/
      Handler: preprocessor/handler.lambda_handler
      Role: !GetAtt PreprocessorRole.Arn
      Timeout: 600
      MemorySize: 1024
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSG
        SubnetIds:
          - !Ref SharedLambdaSubnetAz1Id
          - !Ref SharedLambdaSubnetAz2Id
        Ipv6AllowedForDualStack: true
      Environment:
        Variables:
          DERIVED_PREFIX: derived
          RAW_PREFIX: raw
      Events:
        StepFunctionsTrigger:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [expertise-rag]
              detail-type: [PreprocessorRequest]

  # ───────────────────────────────────────────
  # Lambda: Query API
  # ───────────────────────────────────────────
  QueryAPIFunction:
    Type: AWS::Serverless::Function
    DependsOn: QueryAPILogGroup
    Properties:
      FunctionName: !Sub contextweave-rag-query-api-${Environment}
      Description: >
        Reasoning API: classifies questions, retrieves from pgvector, expands
        graph-linked evidence via Memgraph, synthesizes answers, and returns
        structured expertise responses.
      CodeUri: src/
      Handler: query_api/handler.lambda_handler
      Role: !GetAtt QueryAPIRole.Arn
      Timeout: 60
      MemorySize: 512
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSG
        SubnetIds:
          - !Ref SharedLambdaSubnetAz1Id
          - !Ref SharedLambdaSubnetAz2Id
        Ipv6AllowedForDualStack: true
      Environment:
        Variables:
          GENERATION_MODEL_ID: !Ref GenerationModelId
          ENVIRONMENT: !Ref Environment
          LOG_LEVEL: DEBUG
          CACHE_SIMILARITY_THRESHOLD: "0.95"
          CACHE_TTL_DAYS: "7"
      Events:
        # The well-known URI every A2A client fetches first. It is how a
        # caller learns the routes below exist, rather than hardcoding one --
        # TeamWeave assumed /query-expertise from a constant in its own repo.
        AgentCard:
          Type: HttpApi
          Properties:
            ApiId: !Ref ExpertiseAPI
            Path: /.well-known/agent-card.json
            Method: GET
        QueryExpertise:
          Type: HttpApi
          Properties:
            ApiId: !Ref ExpertiseAPI
            Path: /query-expertise
            Method: POST
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref ExpertiseAPI
            Path: /health
            Method: GET
        RoutingDecisions:
          Type: HttpApi
          Properties:
            ApiId: !Ref ExpertiseAPI
            Path: /routing-decisions
            Method: GET
        Feedback:
          Type: HttpApi
          Properties:
            ApiId: !Ref ExpertiseAPI
            Path: /feedback
            Method: POST
        CorsOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref ExpertiseAPI
            Path: /{proxy+}
            Method: OPTIONS

  # ───────────────────────────────────────────
  # Lambda: DB Initializer (replaces ingestion trigger)
  # ───────────────────────────────────────────
  DBInitFunction:
    Type: AWS::Serverless::Function
    DependsOn: DBInitLogGroup
    Properties:
      FunctionName: !Sub contextweave-rag-db-init-${Environment}
      Description: >
        Creates pgvector schema in PostgreSQL and seeds the Memgraph routing graph
        with initial EFFECTIVE_FOR edge weights. Invoked as a CloudFormation custom
        resource after deployment and callable manually for re-seeding.
      CodeUri: src/
      Handler: ingestion_trigger/handler.lambda_handler
      Role: !GetAtt DBInitRole.Arn
      Timeout: 300
      Environment:
        Variables:
          # Absent when the health surface is off, and `provision_health_db`
          # reads that as "nothing to do" rather than as a failure -- so a
          # deployment without an authorizer provisions no health database,
          # matching the HealthEnabled gate on every other health resource.
          HEALTH_POSTGRES_SECRET_ARN: !If
            - HealthEnabled
            - !Ref HealthPostgresSecret
            - !Ref AWS::NoValue
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSG
        SubnetIds:
          - !Ref SharedLambdaSubnetAz1Id
          - !Ref SharedLambdaSubnetAz2Id
        Ipv6AllowedForDualStack: true

  # ───────────────────────────────────────────
  # Attach RDS instance to secret so AWS injects host/port/engine
  # ───────────────────────────────────────────
  PostgresSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref PostgresSecret
      TargetId: !Ref PostgresRDS
      TargetType: AWS::RDS::DBInstance

  # ───────────────────────────────────────────
  # CloudFormation Custom Resource: post-deployment DB init
  # ───────────────────────────────────────────
  PostDeploymentDBInit:
    Type: AWS::CloudFormation::CustomResource
    # DeletionPolicy: Retain prevents CloudFormation from invoking the Lambda
    # Delete handler during stack deletion.  The handler is a no-op anyway, but
    # without Retain, CloudFormation waits for a response signal that may never
    # arrive if VPC/NAT resources are torn down before the Lambda can PUT to the
    # pre-signed S3 ResponseURL, causing the deletion to time out and fail.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - PostgresSecretAttachment
      - MemgraphEC2
    Properties:
      ServiceToken: !GetAtt DBInitFunction.Arn
      TriggerReason: post-deployment

  # ───────────────────────────────────────────
  # HTTP API (API Gateway v2)
  # ───────────────────────────────────────────
  # ───────────────────────────────────────────
  # The health store: its own bucket, its own database, its own endpoint.
  #
  # Separate from the expertise corpus at every layer that matters, because
  # that corpus is queried by TeamWeave's content teams over an API with no
  # authorizer, searched as one undifferentiated chunk table, and had no
  # per-document delete. See src/shared/health_db.py for each.
  # ───────────────────────────────────────────

  # Deliberately *not* conditioned on HealthEnabled, unlike every other health
  # resource. The API's authorizer block GetAtts this role, and SAM refuses an
  # `Fn::If` anywhere in `Auth` -- on the block, on `Authorizers`, or on the
  # authorizer itself ("Invalid value for 'Auth' property", and the transform
  # fails while `sam validate --lint` passes, so CI would have gone green and
  # `sam build` would have died). A GetAtt to a resource whose condition is
  # false is a template error whether or not anything uses the value, so with
  # the role conditioned the stack could not deploy *without* the health
  # surface -- which is every deploy this repository actually does.
  HealthAuthorizerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      Description: >
        Lets API Gateway invoke the SIWE authorizer, which lives in another
        stack. Without an explicit role SAM adds a resource policy to a
        function this template does not own, and cannot.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSiweAuthorizer
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                # An empty string is not a valid policy Resource, so the
                # disabled state names a function that does exist. Nothing
                # routes to this authorizer when health is off -- no health
                # route exists to carry it -- and the grant adds no reach:
                # API Gateway already invokes the query API on every
                # unauthenticated expertise call.
                Resource: !If
                  - HealthEnabled
                  - !Ref SiweAuthorizerFunctionArn
                  - !GetAtt QueryAPIFunction.Arn

  HealthDocsBucket:
    Type: AWS::S3::Bucket
    Condition: CreateHealthBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "contextweave-health-${AWS::AccountId}-${Environment}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ArtifactsKMSKey
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        # A corrected record replaces the old one in the store; the bucket
        # keeps the previous file so a bad overwrite is recoverable.
        Status: Enabled
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  # Its own credential for its own database. The expertise role has no CONNECT
  # on it, which is what makes the isolation a database grant rather than a
  # naming convention.
  HealthPostgresSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HealthEnabled
    Properties:
      Name: !Sub "contextweave/${Environment}/health-postgres"
      Description: >
        Credentials for the health database. A separate database and role on
        the shared instance -- a separate instance would be stronger and costs
        another instance, so this is a decision rather than an oversight.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"healthrag","dbname":"healthrag"}'
        # GenerateStringKey, not GenerateSecretKey. The wrong name is not
        # ignored -- CloudFormation rejects the unsupported property and the
        # whole stack fails -- but it reads exactly like the right one.
        GenerateStringKey: "password"
        PasswordLength: 32
        ExcludePunctuation: true

  HealthIngestFunction:
    Type: AWS::Serverless::Function
    Condition: HealthEnabled
    Properties:
      FunctionName: !Sub "contextweave-health-ingest-${Environment}"
      CodeUri: src/
      Handler: health_api.ingest.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          HEALTH_POSTGRES_SECRET_ARN: !Ref HealthPostgresSecret
          # The secret holds the credential; the endpoint comes from the
          # instance itself, so nothing here is a hardcoded hostname.
          HEALTH_POSTGRES_HOST: !GetAtt PostgresRDS.Endpoint.Address
          HEALTH_POSTGRES_PORT: !GetAtt PostgresRDS.Endpoint.Port
      # The Postgres instance is PubliclyAccessible: false. Without this the
      # function resolves the endpoint, cannot route to it, and fails on the
      # connect timeout rather than on anything it did wrong.
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSG
        SubnetIds:
          - !Ref SharedLambdaSubnetAz1Id
          - !Ref SharedLambdaSubnetAz2Id
        Ipv6AllowedForDualStack: true
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref HealthPostgresSecret
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
            - Effect: Allow
              # Read-only on the health bucket: ingestion never needs to write
              # there, and a write grant is a way for a bug to alter a record.
              Action: [s3:GetObject]
              Resource: !If
                - CreateHealthBucket
                - !Sub "${HealthDocsBucket.Arn}/*"
                - !Sub "arn:aws:s3:::${HealthDocsBucketName}/*"
            - Effect: Allow
              Action: [kms:Decrypt]
              Resource: !GetAtt ArtifactsKMSKey.Arn

  # S3 events, created and removed alike. Deleting the file deletes the record:
  # without the removed half, withdrawing a document from the bucket would
  # leave it searchable.
  HealthIngestRule:
    Type: AWS::Events::Rule
    Condition: CreateHealthBucket
    Properties:
      Description: Ingest or withdraw a health document when the bucket changes
      EventPattern:
        source: [aws.s3]
        detail-type: ["Object Created", "Object Deleted"]
        detail:
          bucket:
            name: [!Sub "contextweave-health-${AWS::AccountId}-${Environment}"]
      State: ENABLED
      Targets:
        - Id: HealthIngestTarget
          Arn: !GetAtt HealthIngestFunction.Arn

  HealthIngestPermission:
    Type: AWS::Lambda::Permission
    Condition: CreateHealthBucket
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt HealthIngestFunction.Arn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HealthIngestRule.Arn

  HealthAPIFunction:
    Type: AWS::Serverless::Function
    Condition: HealthEnabled
    Properties:
      FunctionName: !Sub "contextweave-health-api-${Environment}"
      CodeUri: src/
      Handler: health_api.handler.lambda_handler
      Timeout: 60
      MemorySize: 1024
      Environment:
        Variables:
          HEALTH_POSTGRES_SECRET_ARN: !Ref HealthPostgresSecret
          # The secret holds the credential; the endpoint comes from the
          # instance itself, so nothing here is a hardcoded hostname.
          HEALTH_POSTGRES_HOST: !GetAtt PostgresRDS.Endpoint.Address
          HEALTH_POSTGRES_PORT: !GetAtt PostgresRDS.Endpoint.Port
      # The Postgres instance is PubliclyAccessible: false. Without this the
      # function resolves the endpoint, cannot route to it, and fails on the
      # connect timeout rather than on anything it did wrong.
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSG
        SubnetIds:
          - !Ref SharedLambdaSubnetAz1Id
          - !Ref SharedLambdaSubnetAz2Id
        Ipv6AllowedForDualStack: true
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
        - Statement:
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref HealthPostgresSecret
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: "*"
      Events:
        # Every one of these carries the authorizer. The expertise routes on
        # this same API carry none, which is the asymmetry the whole store
        # exists for.
        HealthQuery:
          Type: HttpApi
          Properties:
            ApiId: !Ref ExpertiseAPI
            Path: /health/query
            Method: POST
            Auth:
              Authorizer: SiweAuthorizer
        HealthDocuments:
          Type: HttpApi
          Properties:
            ApiId: !Ref ExpertiseAPI
            Path: /health/documents
            Method: GET
            Auth:
              Authorizer: SiweAuthorizer
        HealthDocumentDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref ExpertiseAPI
            Path: /health/documents/{docId}
            Method: DELETE
            Auth:
              Authorizer: SiweAuthorizer

  ExpertiseAPI:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Description: ExpertiseRAG query API – POST /query-expertise
      AccessLogSettings:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: >
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime","httpMethod":"$context.httpMethod",
          "routeKey":"$context.routeKey","status":"$context.status",
          "protocol":"$context.protocol","responseLength":"$context.responseLength",
          "integrationLatency":"$context.integrationLatency",
          "responseLatency":"$context.responseLatency"}
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      # The first authorizer on this API. It is declared but **not** made the
      # default: every expertise route is deliberately open (the A2A card has
      # to be readable without a token, and TeamWeave calls /query-expertise
      # with none), so making this the default would break discovery and the
      # RAG layer at once. The health routes opt in, one by one, at their own
      # Events blocks -- which is the opposite of TeamWeave's API, where a
      # DefaultAuthorizer covered the A2A card by accident and the live URL
      # answered 401 to the clients it exists to inform.
      Auth:
        Authorizers:
          SiweAuthorizer:
            # Same reason as the invoke role above: the block cannot be
            # conditioned, so the value inside it is, and an authorizer built
            # on an empty ARN fails the API's OpenAPI import.
            FunctionArn: !If
              - HealthEnabled
              - !Ref SiweAuthorizerFunctionArn
              - !GetAtt QueryAPIFunction.Arn
            FunctionInvokeRole: !GetAtt HealthAuthorizerInvokeRole.Arn
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            Identity:
              Headers:
                - Authorization
              # Cached per token for five minutes. Zero would call the
              # authorizer on every request to the health store; an hour would
              # keep a revoked session alive for an hour.
              ReauthorizeEvery: 300
      CorsConfiguration:
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - POST
          - GET
          - OPTIONS
        AllowOrigins:
          - '*'
        MaxAge: 300
      Tags:
        Project: ExpertiseRAG
        Environment: !Ref Environment

  # ───────────────────────────────────────────
  # Step Functions: Ingestion Orchestration (simplified – no Bedrock polling)
  # ───────────────────────────────────────────
  IngestionStateMachine:
    Type: AWS::Serverless::StateMachine
    Condition: DeployStepFunctions
    Properties:
      Name: !Sub contextweave-rag-ingestion-${Environment}
      Type: STANDARD
      Role: !GetAtt StepFunctionsRole.Arn
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StepFunctionsLogGroup.Arn
        IncludeExecutionData: true
        Level: ALL
      Tracing:
        Enabled: true
      Definition:
        Comment: >
          ExpertiseRAG ingestion orchestration – preprocesses raw S3 uploads,
          chunks text, generates embeddings, and writes to Memgraph and pgvector.
          No external polling required (all operations are synchronous).
        StartAt: PreprocessRawFiles
        States:
          PreprocessRawFiles:
            Type: Task
            Resource: !GetAtt PreprocessorFunction.Arn
            Parameters:
              repo_prefix.$: $.repo_prefix
              bucket.$: $.bucket
            ResultPath: $.preprocessor_output
            Retry:
              - ErrorEquals: [States.TaskFailed, Lambda.ServiceException]
                IntervalSeconds: 10
                MaxAttempts: 3
                BackoffRate: 2.0
            Catch:
              - ErrorEquals: [States.ALL]
                Next: IngestionFailed
                ResultPath: $.error
            Next: IngestionSuccess

          IngestionSuccess:
            Type: Succeed

          IngestionFailed:
            Type: Fail
            Error: PreprocessingFailed
            Cause: ExpertiseRAG preprocessing did not complete successfully

      Tags:
        Project: ExpertiseRAG
        Environment: !Ref Environment

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:
  HealthApiBase:
    Condition: HealthEnabled
    Description: >
      The authenticated health surface. POST /health/query,
      GET /health/documents, DELETE /health/documents/{docId}. Every one
      requires a bearer token; the expertise routes on the same API do not,
      which is the asymmetry the separate store exists for.
    Value: !Sub "https://${ExpertiseAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/health"

  HealthDocsBucketName:
    Condition: CreateHealthBucket
    Description: >
      Upload a record here and it is ingested; delete it here and the record is
      withdrawn from the store. Separate bucket, separate database, no entry in
      the shared knowledge graph.
    Value: !Ref HealthDocsBucket

  ArtifactsBucketName:
    Description: S3 bucket for raw uploads and derived artifacts
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub ${AWS::StackName}-ArtifactsBucket

  APIEndpoint:
    Description: ExpertiseRAG query API endpoint
    Value: !Sub https://${ExpertiseAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${AWS::StackName}-APIEndpoint

  QueryExpertiseURL:
    Description: Full URL for the POST /query-expertise endpoint
    Value: !Sub https://${ExpertiseAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/query-expertise

  OpenApiSpecPath:
    Description: >
      Path, in this repository, of the OpenAPI document describing the API at
      APIEndpoint. A harness resolves the server URL from APIEndpoint and the
      operations from this file; openapi/contextweave.yaml is kept in sync with
      contracts/contextweave_http_api.json by tests/test_openapi_contract.py.
    Value: openapi/contextweave.yaml

  MemgraphInstanceId:
    Description: Memgraph EC2 instance ID
    Value: !Ref MemgraphEC2
    Export:
      Name: !Sub ${AWS::StackName}-MemgraphInstanceId

  MemgraphPrivateIP:
    Description: Memgraph EC2 private IP (update MemgraphSecret host after deploy)
    Value: !GetAtt MemgraphEC2.PrivateIp
    Export:
      Name: !Sub ${AWS::StackName}-MemgraphPrivateIP

  MemgraphSecretArn:
    Description: Secrets Manager ARN for Memgraph connection details
    Value: !Ref MemgraphSecret
    Export:
      Name: !Sub ${AWS::StackName}-MemgraphSecretArn

  PostgresEndpoint:
    Description: RDS PostgreSQL endpoint
    Value: !GetAtt PostgresRDS.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-PostgresEndpoint

  PostgresSecretArn:
    Description: Secrets Manager ARN for PostgreSQL credentials
    Value: !Ref PostgresSecret
    Export:
      Name: !Sub ${AWS::StackName}-PostgresSecretArn

  # The endpoint alone is not enough to connect or to operate the instance.
  # These three close that gap so a test harness (or an operator) can resolve
  # everything it needs from `describe-stacks` instead of reading the template.
  PostgresPort:
    Description: RDS PostgreSQL port
    Value: !GetAtt PostgresRDS.Endpoint.Port
    Export:
      Name: !Sub ${AWS::StackName}-PostgresPort

  PostgresDbName:
    Description: PostgreSQL database name (pgvector chunks, query_cache, routing_decisions)
    Value: !Ref PostgresDbName
    Export:
      Name: !Sub ${AWS::StackName}-PostgresDbName

  PostgresInstanceIdentifier:
    Description: >
      RDS DB instance identifier. Needed to start/stop the instance -- the
      deploy pipeline has to start it before touching the stack, because RDS
      refuses every modification while stopped and that wedges the rollback
      too. Previously this had to be dug out with describe-stack-resource.
    Value: !Ref PostgresRDS
    Export:
      Name: !Sub ${AWS::StackName}-PostgresInstanceIdentifier

  IngestionStateMachineArn:
    Description: Step Functions ingestion state machine ARN
    Condition: DeployStepFunctions
    Value: !Ref IngestionStateMachine
    Export:
      Name: !Sub ${AWS::StackName}-IngestionStateMachine


  KMSKeyArn:
    Description: KMS key ARN for artifact encryption
    Value: !GetAtt ArtifactsKMSKey.Arn
