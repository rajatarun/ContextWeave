# Experiment configuration. Scripts refuse to run when a required key or a
# model price is absent. Prices are USD per 1,000,000 tokens.
#
# Claude Haiku 4.5 list price is input 1.00 / output 5.00: AWS public pricing
# page, metered unit map bedrockfoundationmodels (publication
# 2026-09-30T00:19:12Z), region US East (N. Virginia). Rate codes
# DY4B4Q3TRTAY8V6G.4799GE89SK.6YS6EN2CT7 (input) and
# XADKFYXVGBFBJSU7.4799GE89SK.6YS6EN2CT7 (output). The configured price is
# that list price plus the 10% premium for the US cross-region inference
# profile, input 1.10 / output 5.50. Source: AWS Cost Explorer for 2026-10-06,
# usage types USE1-MP:USE1_InputTokenCount-Units (9.39M tokens, $10.3296,
# about $1.10/M) and USE1-MP:USE1_OutputTokenCount-Units (0.30M, $1.6376).
#
# Llama 3.3 70B Instruct input 0.72 / output 0.72: AWS Price List offer
# AmazonBedrock, us-east-1, version 20261005210410, publication
# 2026-10-05T21:04:10Z. On-demand price $0.00072 per 1K tokens. That rate
# matched the bill.

seed: 0
# First n of the seeded shuffle: sort by qid, then random.Random(seed).
# 1100 is the prefix of the 1200 draw, which is the prefix of a 1500 draw,
# all with the same seed.
n_per_dataset: 1100
top_k: 5
bootstrap_samples: 1000
replay_seeds: [0, 1, 2, 3, 4]

embedding_model: sentence-transformers/all-MiniLM-L6-v2
nli_model: cross-encoder/nli-deberta-v3-small
grounding_threshold: 0.6
judge_sample_rate: 0.05
grounding_weight: 1.0
judge_weight: 2.0
self_weight: 1.0

generator_model_id: us.anthropic.claude-haiku-4-5-20251001-v1:0
judge_model_id: us.meta.llama3-3-70b-instruct-v1:0
# Later stages. Prices are in the tables below. This PR does not call them.
subset_generator_model_id: us.amazon.nova-pro-v1:0
adjudicator_model_id: openai.gpt-oss-120b-1:0
region: us-east-1
schema_version: 2
# on_demand is the per-row Converse path. batch writes JSONL and submits
# CreateModelInvocationJob. The role and bucket are read from the environment
# variables named below, or from batch.role_arn / batch.bucket when set.
inference_mode: on_demand
temperature: 0
# One JSON object is a few dozen tokens. 256 leaves room for the object when
# the model also starts a sentence. A complete object followed by prose that
# hits this cap is robust status ok with trailing_truncated set. Only an
# object cut off mid-token is self_status truncated, and that is not a
# reported confidence.
generator_max_output_tokens: 256
judge_max_output_tokens: 300

# Hard ceiling for generation and the judge together, USD. The shared
# cost_ledger is what both stages read. A stage also has its own --max-usd.
# The full run passes --total-usd-cap 29.80: a 10-question smoke already
# spent $0.19 of this $30.
total_usd_cap: 30

# Token estimates use ceil(utf-8 bytes / 4). That is an approximation, not a
# provider tokenizer. Dry-run output cost charges the max output length.
token_estimate: ceil_utf8_bytes_div_4

keyword_weight: 0.25
bm25_k1: 1.5
bm25_b: 0.75

# NQ contexts from the MRQA release are split into windows of this many
# characters, with this overlap. v2 puts every window of the dev file in the
# shared collection. nq_pool_size is unused by that collection and remains so
# the older per-question helper still has its parameter.
nq_window_chars: 800
nq_overlap_chars: 200
nq_pool_size: 10

spacy_model: en_core_web_sm
graph_damping: 0.85
graph_max_iter: 40
graph_tol: 1.0e-10

# Approved v2 constants. The signals, subset, and analysis stages read these
# in later changes. judge_sample_rate above is what the current judge stage
# still uses.
v2:
  judge_sample_rate: 0.60
  held_out_fraction: 0.20
  subset_questions: 250
  subset_haiku_samples: 5
  subset_temperature: 1
  replay_seeds: 500
  replay_rounds: 10000
  judge_coverage: [0.01, 0.05, 0.20, 1.0]
  drift_discounts: [0.99, 0.995, 0.999]
  adjudication_f1_low: 0.2
  adjudication_f1_high: 0.8

batch:
  role_arn_env: BEDROCK_BATCH_ROLE_ARN
  bucket_env: BEDROCK_BATCH_BUCKET
  role_arn: ""
  bucket: ""
  prefix: experiments/v2
  min_records: 100
  poll_seconds: 30
  timeout_hours: 24

# Per-arm rank normalization closes the self-vs-grounding regret gap by at
# least this fraction, on every dataset, before the scale objection is supported.
normalized_self_gap_fraction: 0.5

# Deployed fallback constants (synthesizer.py). Used only by the
# self_with_fallbacks replay row. The skip-unobserved row does not use them.
fallback_omitted: 0.7
fallback_unparseable: 0.5
fallback_failed: 0.0

# Falsifiable-prediction thresholds. Fixed here, before any model run.
high_coverage: 0.8
low_auroc_max: 0.6

datasets:
  squad:
    id: squad
    huggingface: rajpurkar/squad_v2
    split: validation
  hotpot:
    id: hotpot
    huggingface: hotpotqa/hotpot_qa
    config: distractor
    split: validation
  nq:
    id: nq
    url: https://s3.us-east-2.amazonaws.com/mrqa/release/v2/dev/NaturalQuestionsShort.jsonl.gz
    md5: c0347eebbca02d10d1b07b9a64efe61d
    description: >
      MRQA 2019 in-domain dev file NaturalQuestionsShort. Natural Questions
      adapted to extractive QA: gold short-answer strings and the Wikipedia
      context, truncated by MRQA to the first 800 tokens and kept only when
      the short answer occurs in that window.

prices_usd_per_million_tokens:
  us.anthropic.claude-haiku-4-5-20251001-v1:0:
    input: 1.10
    output: 5.50
    source: >
      AWS Cost Explorer 2026-10-06 for the US cross-region inference profile:
      list price input 1.00 / output 5.00 plus a 10% premium.
      USE1-MP:USE1_InputTokenCount-Units, 9.39M tokens, $10.3296.
      USE1-MP:USE1_OutputTokenCount-Units, 0.30M tokens, $1.6376.
      List price: AWS pricing page metered unit map bedrockfoundationmodels,
      US East (N. Virginia), publication 2026-09-30T00:19:12Z.
      Input rate code DY4B4Q3TRTAY8V6G.4799GE89SK.6YS6EN2CT7, output rate code
      XADKFYXVGBFBJSU7.4799GE89SK.6YS6EN2CT7.
  us.meta.llama3-3-70b-instruct-v1:0:
    input: 0.72
    output: 0.72
    source: >
      AWS Price List AmazonBedrock us-east-1 version 20261005210410,
      publication 2026-10-05T21:04:10Z. On-demand $0.00072 per 1K tokens
      for Llama 3.3 70B input and output.
  us.amazon.nova-pro-v1:0:
    input: 0.80
    output: 3.20
    source: >
      AWS Price List AmazonBedrock us-east-1 version 20261006144726,
      publication 2026-10-06T14:47:26Z. On-demand $0.0008 per 1K input
      (SKU 8X836UXRHN5Q5T2H, USE1-NovaPro-input-tokens) and $0.0032 per 1K
      output (SKU ARFVY95XGU794VBG, USE1-NovaPro-output-tokens). Applied to
      the configured inference-profile id. No separate profile premium was
      in that offer.
  openai.gpt-oss-120b-1:0:
    input: 0.15
    output: 0.60
    source: >
      AWS Price List AmazonBedrock us-east-1 version 20261006144726,
      publication 2026-10-06T14:47:26Z. On-demand $0.00015 per 1K input
      (SKU Q2U4FFKKTW34QVFG, USE1-gpt-oss-120b-input-tokens) and $0.0006 per
      1K output (SKU KGHQD8ZHB5468Z38, USE1-gpt-oss-120b-output-tokens).
      Applied to openai.gpt-oss-120b-1:0. No separate profile premium was
      in that offer.

# Batch rates. A ledger row with pricing batch is costed from this table.
# Haiku batch is half the billed cross-region on-demand rate above.
# Llama, Nova Pro, and gpt-oss-120b are the Batch Inference SKUs in the
# us-east-1 offer named on each row.
batch_prices_usd_per_million_tokens:
  us.anthropic.claude-haiku-4-5-20251001-v1:0:
    input: 0.55
    output: 2.75
    source: >
      Half of the billed cross-region on-demand rate 1.10 / 5.50.
      The AmazonBedrock offer does not list Claude Haiku 4.5.
  us.meta.llama3-3-70b-instruct-v1:0:
    input: 0.36
    output: 0.36
    source: >
      AWS Price List AmazonBedrock us-east-1 version 20261006144726.
      Batch $0.00036 per 1K input (SKU E748GM9E4FUC8WY6) and output
      (SKU D96KFRU98U5RRW7F).
  us.amazon.nova-pro-v1:0:
    input: 0.40
    output: 1.60
    source: >
      AWS Price List AmazonBedrock us-east-1 version 20261006144726.
      Batch $0.0004 per 1K input (SKU 6FVZT3BBCSHTHQND,
      USE1-NovaPro-input-tokens-batch) and $0.0016 per 1K output
      (SKU URFXX2XGYJ66495M, USE1-NovaPro-output-tokens-batch).
  openai.gpt-oss-120b-1:0:
    input: 0.075
    output: 0.30
    source: >
      AWS Price List AmazonBedrock us-east-1 version 20261006144726.
      Batch $0.000075 per 1K input (SKU P9G2AVNMEZE36NEN) and $0.0003 per
      1K output (SKU AQEZQAY2B27EKGDJ).
